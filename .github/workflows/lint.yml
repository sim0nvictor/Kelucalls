name: Lint verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply scoped lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}")
              file.write_text(text.replace(old, new))

          replace(
              "src/app/auth/sign-out/route.ts",
              'import type { NextRequest } from "next/server";\n\n',
              ''
          )
          replace(
              "src/app/auth/sign-out/route.ts",
              'export async function POST(request: NextRequest) {',
              'export async function POST() {'
          )
          replace(
              "src/app/auth/sign-out/route.ts",
              'export async function GET(request: NextRequest) {',
              'export async function GET() {'
          )
          replace(
              "src/app/insights/[slug]/page.tsx",
              '  let processed = content\n',
              '  const processed = content\n'
          )
          replace(
              "src/app/insights/page.tsx",
              "            We're building high-quality crypto intelligence content for you.",
              "            We&apos;re building high-quality crypto intelligence content for you."
          )
          replace(
              "src/app/insights/page.tsx",
              '      {/* Editor\'s Picks */}',
              '      {/* Editor\'s Picks */}'
          )
          replace(
              "src/app/insights/page.tsx",
              '          <SectionHeader title="Editor\'s Picks" icon={Star} color="#a855f7" />',
              '          <SectionHeader title="Editor’s Picks" icon={Star} color="#a855f7" />'
          )
          replace(
              "src/app/insights/tag/[slug]/page.tsx",
              '          {total} article{total !== 1 ? "s" : ""} tagged with "{tag.name}"',
              '          {total} article{total !== 1 ? "s" : ""} tagged with &quot;{tag.name}&quot;'
          )
          replace(
              "src/components/chain-icon.tsx",
              'import { useEffect, useState } from "react";',
              'import { useState } from "react";'
          )
          replace(
              "src/components/chain-icon.tsx",
              '''  const [broken, setBroken] = useState(false);\n\n  // A row can be re-used for a different chain while scrolling a virtual list.\n  useEffect(() => {\n    setBroken(false);\n  }, [iconUrl]);\n\n  const showImage = iconUrl !== null && !broken;''',
              '''  const [brokenUrl, setBrokenUrl] = useState<string | null>(null);\n  const showImage = iconUrl !== null && iconUrl !== brokenUrl;'''
          )
          replace(
              "src/components/chain-icon.tsx",
              '      onError={() => setBroken(true)}',
              '      onError={() => setBrokenUrl(iconUrl)}'
          )
          replace(
              "src/components/insights/article-share.tsx",
              'import { useEffect, useMemo, useState } from "react";',
              'import { useEffect, useMemo, useState, useSyncExternalStore } from "react";'
          )
          replace(
              "src/components/insights/article-share.tsx",
              '''const actionClass =\n  "inline-flex h-9 shrink-0 cursor-pointer items-center gap-2 rounded-full border border-white/12 bg-white/6 px-4 text-xs font-medium text-white transition-all duration-300 outline-none hover:border-cyan-400/40 hover:bg-white/10";\n''',
              '''const actionClass =\n  "inline-flex h-9 shrink-0 cursor-pointer items-center gap-2 rounded-full border border-white/12 bg-white/6 px-4 text-xs font-medium text-white transition-all duration-300 outline-none hover:border-cyan-400/40 hover:bg-white/10";\n\nfunction subscribeToLocation() {\n  return () => {};\n}\n\nfunction getBrowserShareUrl() {\n  return `${window.location.origin}${window.location.pathname}`;\n}\n\nfunction getCanNativeShare() {\n  return typeof navigator.share === "function";\n}\n'''
          )
          replace(
              "src/components/insights/article-share.tsx",
              '''  const [shareUrl, setShareUrl] = useState(url);\n  const [copied, setCopied] = useState(false);\n  const [canNativeShare, setCanNativeShare] = useState(false);\n\n  // Prefer the real browser URL once hydrated (handles preview deploys and custom domains).\n  useEffect(() => {\n    if (typeof window === "undefined") return;\n    setShareUrl(`${window.location.origin}${window.location.pathname}`);\n    setCanNativeShare(\n      typeof navigator !== "undefined" && typeof navigator.share === "function"\n    );\n  }, []);''',
              '''  const shareUrl = useSyncExternalStore(\n    subscribeToLocation,\n    getBrowserShareUrl,\n    () => url\n  );\n  const canNativeShare = useSyncExternalStore(\n    subscribeToLocation,\n    getCanNativeShare,\n    () => false\n  );\n  const [copied, setCopied] = useState(false);'''
          )
          replace(
              "src/components/tokens/live-token-price.tsx",
              '  const [now, setNow] = useState<number | null>(null);',
              '  const [now, setNow] = useState(() => Date.now());'
          )
          replace(
              "src/components/tokens/live-token-price.tsx",
              '''    void load();\n    const timer = window.setInterval(() => {''',
              '''    const initialTimer = window.setTimeout(() => void load(), 0);\n    const timer = window.setInterval(() => {'''
          )
          replace(
              "src/components/tokens/live-token-price.tsx",
              '    return () => window.clearInterval(timer);\n  }, [address, symbol, load, refreshMs]);',
              '''    return () => {\n      window.clearTimeout(initialTimer);\n      window.clearInterval(timer);\n    };\n  }, [address, symbol, load, refreshMs]);'''
          )
          replace(
              "src/components/tokens/live-token-price.tsx",
              '''  useEffect(() => {\n    setNow(Date.now());\n    const timer = window.setInterval(() => setNow(Date.now()), 1_000);''',
              '''  useEffect(() => {\n    const timer = window.setInterval(() => setNow(Date.now()), 1_000);'''
          )
          replace(
              "src/components/tokens/live-token-price.tsx",
              '''    now === null || !snapshot\n      ? null''',
              '''    !snapshot\n      ? null'''
          )
          replace(
              "src/components/tokens/token-market.tsx",
              '  const [now, setNow] = useState<number | null>(null);',
              '  const [now, setNow] = useState(() => Date.now());'
          )
          replace(
              "src/components/tokens/token-market.tsx",
              '''  useEffect(() => {\n    setNow(Date.now());\n    const timer = window.setInterval(() => setNow(Date.now()), 1_000);''',
              '''  useEffect(() => {\n    const timer = window.setInterval(() => setNow(Date.now()), 1_000);'''
          )
          replace(
              "src/components/tokens/token-market.tsx",
              '''  const secondsAgo =\n    now === null ? null : Math.max(0, Math.round((now - new Date(fetchedAt).getTime()) / 1000));''',
              '''  const secondsAgo = Math.max(\n    0,\n    Math.round((now - new Date(fetchedAt).getTime()) / 1000)\n  );'''
          )
          replace(
              "src/lib/research/news/rss-provider.ts",
              'function parsePubDate(value: string, collectedAt: string): string | null {',
              'function parsePubDate(value: string): string | null {'
          )
          replace(
              "src/lib/research/news/rss-provider.ts",
              '        const publishedAt = parsePubDate(entry.pubDate, collectedAt);',
              '        const publishedAt = parsePubDate(entry.pubDate);'
          )
          replace(
              "src/lib/research/signals/detectors/narrative-acceleration.ts",
              '''function safeNumber(value: number | null | undefined): number | null {\n  return typeof value === "number" && Number.isFinite(value) ? value : null;\n}\n\n''',
              ''
          )
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Commit verified fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: clear ESLint errors"
          git push
