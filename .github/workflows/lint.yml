name: Lint verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: |
          npm run lint 2>&1 | tee lint-output.txt
          exit ${PIPESTATUS[0]}
      - name: Publish lint diagnostics
        if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## ESLint diagnostics'
            echo '```text'
            cat lint-output.txt
            echo '```'
          } > lint-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file lint-comment.md
      - name: Fail when lint fails
        if: steps.lint.outcome == 'failure'
        run: exit 1
